name: Agentic Coding

on:
  push:
    branches: [dev, agentic-coding-implementation]
  pull_request:
    paths:
      - 'src/agentic_coding/**'
      - 'routes/agentic_coding*'
      - 'tests/test_agentic_coding*.py'
      - '.github/workflows/agentic-coding.yml'

jobs:
  focused-tests:
    name: Agentic Coding focused tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_agentic_coding_security.py tests/test_agentic_coding_scaffold.py
